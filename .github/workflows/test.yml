name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same PR/branch supersedes the older run: cancel it
# instead of letting both hold runners. Runs on main are never cancelled,
# so every merged commit keeps its own result.
concurrency:
  group: test-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  linux:
    name: Linux - shell, PowerShell, Wine end-to-end
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      # The runner's apt mirror list (/etc/apt/apt-mirrors.txt) is Azure first,
      # then archive/security.ubuntu.com. When those stall, apt waits out a
      # full timeout per file and the job looks hung (2026-11-11: Azure did not
      # resolve, the other two timed out). Probe each candidate with a package
      # this job really installs (release pocket, so the path never changes)
      # and point apt at the first mirror that serves it.
      - name: Pick a responsive Ubuntu mirror
        run: |
          pkg=pool/universe/m/mingw-w64/mingw-w64-common_11.0.1-3build1_all.deb
          for m in http://azure.archive.ubuntu.com/ubuntu/ \
                   http://archive.ubuntu.com/ubuntu/ \
                   https://mirrors.edge.kernel.org/ubuntu/ \
                   https://mirror.us.leaseweb.net/ubuntu/ \
                   https://ftp.uni-stuttgart.de/ubuntu/; do
            if curl -fsS --max-time 15 -r 0-65535 -o /dev/null "$m$pkg"; then
              echo "Using Ubuntu mirror $m"
              if [ "$m" != http://azure.archive.ubuntu.com/ubuntu/ ]; then
                echo "::warning::default Ubuntu mirrors unresponsive - using $m for this run"
                printf '%s\tpriority:1\n' "$m" | sudo tee /etc/apt/apt-mirrors.txt
              fi
              exit 0
            fi
            echo "no answer from $m"
          done
          echo "::warning::no Ubuntu mirror answered - keeping the runner's defaults"

      - name: Install Wine and a MinGW cross-compiler
        timeout-minutes: 10
        run: |
          # Short per-request timeouts so a stalled mirror fails over quickly.
          apt_opts="-q -o Acquire::http::Timeout=10 -o Acquire::https::Timeout=10 -o Acquire::Retries=3"
          sudo apt-get update $apt_opts
          sudo apt-get install -y $apt_opts --no-install-recommends wine64 libwine gcc-mingw-w64-x86-64 shellcheck

      - name: shellcheck
        run: shellcheck -x setup-dev-tools.sh setup-user.sh test/run-tests.sh test/e2e/run-e2e.sh test/e2e/stubs/* test/e2e/linuxbin/wsl.exe

      - name: All tests (pwsh is preinstalled on the runner)
        env:
          E2E: "1"
          WINE: /usr/lib/wine/wine64
          WINEDEBUG: "-all"
          MINGW_CC: x86_64-w64-mingw32-gcc
          PWSH: pwsh
        run: bash test/run-tests.sh

  windows:
    name: Windows - real cmd.exe + Windows PowerShell 5.1 end-to-end
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Parse every PowerShell file with Windows PowerShell 5.1
        shell: powershell
        run: |
          $bad = 0
          foreach ($f in Get-ChildItem -Recurse -Filter *.ps1) {
            $err = $null
            [void][Management.Automation.Language.Parser]::ParseFile($f.FullName, [ref]$null, [ref]$err)
            if ($err) { $bad++; Write-Host "FAIL $($f.FullName): $($err[0].Message)" } else { Write-Host "ok   $($f.Name)" }
          }
          Write-Host "PowerShell $($PSVersionTable.PSVersion)"
          exit $bad

      - name: Install pywinpty
        run: python -m pip install --disable-pip-version-check pywinpty

      - name: End-to-end in a real console (only wsl.exe is faked)
        env:
          E2E_WINDOWS_CI: "1"
          E2E_STEP_TIMEOUT: "120"
        run: python test/e2e/windows/run_e2e_windows.py

  # No fakes at all: Microsoft's wsl.exe and a real Debian, installed by
  # Vampire/setup-wsl on the hosted runner. wsl-setup.bat then takes its
  # "already installed" path, so only `wsl --install` itself is not covered.
  real-wsl:
    name: Windows - real WSL + real Debian (no fakes)
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: Vampire/setup-wsl@v7
        with:
          distribution: Debian-13

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install pywinpty
        run: python -m pip install --disable-pip-version-check pywinpty

      - name: wsl-setup.bat against the real distro, twice
        env:
          E2E_WINDOWS_CI: "1"
          E2E_STEP_TIMEOUT: "300"
        working-directory: test/e2e/windows
        run: python run_real_wsl.py


<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300">
  <rect width="1200" height="300" fill="#0d1117"/>

  <!-- windows tile mark -->
  <g transform="translate(90,110)">
    <rect x="0" y="0" width="34" height="34" fill="#e6edf3"/>
    <rect x="40" y="0" width="34" height="34" fill="#e6edf3"/>
    <rect x="0" y="40" width="34" height="34" fill="#e6edf3"/>
    <rect x="40" y="40" width="34" height="34" fill="#e6edf3"/>
  </g>

  <!-- arrow -->
  <line x1="210" y1="127" x2="300" y2="127" stroke="#f2a93b" stroke-width="4"/>
  <polygon points="300,117 322,127 300,137" fill="#f2a93b"/>

  <!-- tux-ish silhouette (simple abstract penguin) -->
  <g transform="translate(345,80)">
    <ellipse cx="45" cy="55" rx="42" ry="52" fill="#f2a93b"/>
    <ellipse cx="45" cy="60" rx="24" ry="34" fill="#0d1117"/>
    <circle cx="35" cy="30" r="4" fill="#0d1117"/>
    <circle cx="55" cy="30" r="4" fill="#0d1117"/>
    <polygon points="40,38 50,38 45,48" fill="#e6a23c"/>
  </g>

  <text x="500" y="120" font-family="Arial, Helvetica, sans-serif" font-size="52" font-weight="800" fill="#e6edf3">wsl<tspan fill="#f2a93b">-setup</tspan></text>
  <text x="500" y="158" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#8b949e">Windows → WSL2 + Ubuntu, automated end to end</text>
  <text x="500" y="188" font-family="ui-monospace, Consolas, monospace" font-size="16" fill="#3fb950">nvm · docker · gh</text>
</svg>
